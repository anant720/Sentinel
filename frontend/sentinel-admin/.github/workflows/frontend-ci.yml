name: Sentinel Admin Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'sentinel-admin/package-lock.json'

    - name: NPM Install
      run: npm ci --legacy-peer-deps
      working-directory: ./sentinel-admin

    # Phase F14: Absolute Dependency Supply Chain Security Gate
    - name: Security Vulnerability Audit
      run: npm audit --audit-level=high
      working-directory: ./sentinel-admin

    # Phase F13: Lint and Type Boundaries
    - name: Lint Codebase
      run: npm run lint
      working-directory: ./sentinel-admin

    # Phase F12: Component & Store Security Flow
    - name: Run Unit & Integration Guards
      run: npm run test -- --run
      working-directory: ./sentinel-admin

    # Phase F13: Output Production Bundle
    - name: Build Web Application
      run: npm run build
      working-directory: ./sentinel-admin
