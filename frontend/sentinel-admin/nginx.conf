server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend if needed (optional)
    # location /api/ {
    #     proxy_pass http://api:3000/;
    # }
}
