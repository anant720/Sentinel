events {
    worker_connections 1024;
}

http {
    # Define a 10MB memory zone to track raw IPs natively pushing 5 requests per second limits implicitly
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # Protect against raw payload floods
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 10k;
    large_client_header_buffers 2 1k;

    upstream sentinel_api {
        server api:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Primary security headers natively proxying
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /auth/login {
            # Attach the strict rate limiting structural zone natively pushing 429
            limit_req zone=login burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://sentinel_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://sentinel_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
