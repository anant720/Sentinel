version: "3.8"

services:
  # ── 1. API GATEWAY ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  # ── 2. APPLICATION CORE ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=api
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always

  # ── 3. WORKER SCALING ──────────────────────────────────────────────────────
  # Using compose replicas to strictly scale BullsMQ consumers 
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ROLE=worker
    env_file:
      - .env
    deploy:
      replicas: 4 # Scales 4 independent thread loops tracking the Detection Engine automatically
    depends_on:
      - db
      - redis
    restart: always

  # ── 4. STATEFUL SERVICES ───────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-REPLACE_WITH_SECURE_PASSWORD}
      POSTGRES_DB: sentinel_core
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    restart: always


volumes:
  pgdata:
