groups:
  - name: sentinel-security-alerts
    rules:
      - alert: HighLoginFailureRate
        expr: rate(login_failures_total[1m]) * 60 > 50
        for: 1m
        labels:
          severity: high
          team: security
        annotations:
          summary: "Possible credential stuffing attack detected"
          description: "Login failures have exceeded 50 per minute (current value: {{ $value }})."

      - alert: HighRiskScoreSpike
        expr: risk_score_average > 70
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Active attack detected based on Threat Intelligence Risk Scoring"
          description: "The global risk score average has spiked above 70 (current value: {{ $value }})."

      - alert: WorkerQueueOverflow
        expr: worker_queue_depth > 10000
        for: 3m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "BullMQ queue overflow detected"
          description: "The background detection worker queue has exceeded 10,000 pending jobs, indicating severe backpressure."
