groups:
  - name: sentinel_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(sentinel_http_request_duration_seconds_count{status=~"5.+"}[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Error Rate detected"
          description: "Sentinel Core API cluster is inherently returning 5xx boundaries above critical logical limits. Potential structural crash inbound."

      - alert: ExcessiveRateLimiting
        expr: rate(sentinel_rate_limit_triggers_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Abnormal Rate Limiting Volumetric Bursts"
          description: "Identified high sustained volumetric IP throttling geometrically. Investigate potential ongoing Application-layer DoS."
