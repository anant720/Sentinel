global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - 'alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'sentinel_api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
