# docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────────
# Production deployment: built Docker images, Nginx HTTPS, Prometheus, Grafana
# Usage: docker compose -f docker-compose.prod.yml up -d
# Prerequisites: .env.prod file in the same directory
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Nginx Reverse Proxy (HTTPS Termination) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro # Mount your cert.pem + key.pem here
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - sentinel-mesh
    restart: unless-stopped

  # ── Backend API (Built Production Image) ───────────────────────────────────
  api:
    build:
      context: ./sentinel-core
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - ROLE=api
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-mesh
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/health/live || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── BullMQ Background Worker ──────────────────────────────────────────────
  worker:
    build:
      context: ./sentinel-core
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - ROLE=worker
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: [ "node", "dist/worker.js" ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-mesh
    restart: unless-stopped

  # ── Frontend (Built Production Next.js) ──────────────────────────────────
  frontend:
    build:
      context: ./sentinel-admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://your-domain.com/api
    environment:
      - NODE_ENV=production
    networks:
      - sentinel-mesh
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-mesh
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file:
      - .env.prod
    volumes:
      - redis_data:/data
    networks:
      - sentinel-mesh
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sentinel-mesh
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - sentinel-mesh
    restart: unless-stopped

networks:
  sentinel-mesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_logs:
